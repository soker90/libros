name: Validate book metadata resolver

on:
  push:
    branches:
      - improve-isbn-book-matching
      - master
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check .github/scripts/book-overrides.mjs
          node --check .github/scripts/book-matching.mjs
          node --check .github/scripts/book-matching.test.mjs
          node --check .github/scripts/book-providers.mjs
          node --check .github/scripts/book-metadata-merge.mjs
          node --check .github/scripts/book-metadata-merge.test.mjs
          node --check .github/scripts/refresh-book-metadata.mjs
          node --check .github/scripts/spanish-book-catalog.mjs
          node --check .github/scripts/spanish-book-catalog.test.mjs
          node --check .github/scripts/github-issues.mjs
          node --check .github/scripts/enrich-book-issue.mjs
          node --check .github/scripts/enrich-book-issue.test.mjs
          node --check .github/scripts/sync-issue-collections.mjs
          node --check .github/scripts/sync-issue-collections.test.mjs
          node --check .github/scripts/sync-external-reviews.mjs
          node --check .github/scripts/sync-external-reviews.test.mjs
          node --check .github/scripts/normalize-publication-dates.mjs
          node --check .github/scripts/normalize-publication-dates.test.mjs
          node --check .github/scripts/sync-goodreads-reading-state.mjs
          node --check .github/scripts/sync-goodreads-reading-state.test.mjs
          node --check .github/scripts/deduplicate-generated-books.mjs
          node --check .github/scripts/deduplicate-generated-books.test.mjs .github/scripts/sync-external-reviews.test.mjs
      - name: Test book metadata utilities
        run: node --test .github/scripts/book-matching.test.mjs .github/scripts/enrich-book-issue.test.mjs .github/scripts/book-metadata-merge.test.mjs .github/scripts/spanish-book-catalog.test.mjs .github/scripts/sync-issue-collections.test.mjs .github/scripts/normalize-publication-dates.test.mjs .github/scripts/sync-goodreads-reading-state.test.mjs .github/scripts/deduplicate-generated-books.test.mjs
