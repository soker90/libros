name: Refresh existing book metadata

on:
  push:
    branches: [master]
    paths:
      - ".github/scripts/book-metadata-merge.mjs"
      - ".github/scripts/refresh-book-metadata.mjs"
      - ".github/workflows/refresh-book-metadata.yml"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number. Leave blank to refresh all book issues."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-book-metadata
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh metadata using exact ISBN matches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Validate refresh script
        run: node --check .github/scripts/refresh-book-metadata.mjs
      - name: Refresh existing book metadata
        run: node .github/scripts/refresh-book-metadata.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}

      - name: Regenerate bookshelf summary and API from refreshed metadata
        uses: AnandChowdhary/bookshelf-action@HEAD
        with:
          command: "updateSummary"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore external reviews, long synopses and collections
        run: node .github/scripts/sync-external-reviews.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Commit regenerated catalogue
        run: |
          git add README.md api.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh book descriptions and catalogue"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
