name: "Bookshelf Action: New Issue"
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
jobs:
  bookshelf-action:
    name: Resolve book metadata and update bookshelf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate resolver syntax
        run: node --check .github/scripts/enrich-book-issue.mjs
      - name: Resolve book metadata
        run: node .github/scripts/enrich-book-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate bookshelf summary and API
        uses: AnandChowdhary/bookshelf-action@HEAD
        with:
          command: "updateSummary"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
