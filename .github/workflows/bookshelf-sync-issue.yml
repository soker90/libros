name: "Bookshelf Action: Sync Issue to API"

on:
  issues:
    types: [edited, labeled, unlabeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: bookshelf-summary
  cancel-in-progress: false

jobs:
  update-summary:
    name: Regenerate README and api.json from issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate bookshelf summary and API
        uses: AnandChowdhary/bookshelf-action@HEAD
        with:
          command: "updateSummary"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prefer Goodreads entries and sync collections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          node .github/scripts/dedupe-goodreads-books.mjs
          node .github/scripts/sync-issue-collections.mjs
          git add README.md api.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync bookshelf and prefer Goodreads duplicates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
