name: "Bookshelf Action: Sync Issue to API"

on:
  issues:
    types: [edited, labeled, unlabeled]
  push:
    branches: [master]
    paths:
      - ".github/scripts/sync-goodreads-reading-state.mjs"
      - ".github/scripts/sync-goodreads-reading-state.test.mjs"
      - ".github/scripts/sync-external-reviews.mjs"
      - ".github/scripts/sync-external-reviews.test.mjs"
      - ".github/workflows/bookshelf-sync-issue.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: bookshelf-summary
  cancel-in-progress: false

jobs:
  update-summary:
    name: Regenerate README and api.json from issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test metadata synchronization scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Regenerate bookshelf summary and API
        if: github.event_name == 'issues'
        uses: AnandChowdhary/bookshelf-action@HEAD
        with:
          command: "updateSummary"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync collections and normalize metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            node .github/scripts/sync-issue-collections.mjs
            node .github/scripts/normalize-publication-dates.mjs
          fi
          node .github/scripts/sync-goodreads-reading-state.mjs
          node .github/scripts/deduplicate-generated-books.mjs
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            node .github/scripts/sync-external-reviews.mjs
          fi
          git add README.md api.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync bookshelf metadata"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Delete confirmed duplicate Goodreads issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBROS_ADMIN_TOKEN: ${{ secrets.LIBROS_ADMIN_TOKEN }}
        run: node .github/scripts/delete-duplicate-goodreads-issues.mjs
